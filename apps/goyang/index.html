</style>

// 수집 데이터: 이 사이트의 data/ 폴더에서 먼저 받고, 없으면 GitHub 원본에서 받기
// 저장소를 다른 계정·조직으로 옮기면 아래 한 줄만 바꾸면 돼요 (예: "songgollab/airang-cities")
const REPO = "jinbok2279/airang-cities";
const RAW = "https://raw.githubusercontent.com/" + REPO + "/main/data/goyang/";
function dataFetch(name) {
  return fetch("./data/" + name, { cache: "no-cache" }).then(r => r.ok ? r : Promise.reject(r.status))
    .catch(() => fetch(RAW + name, { cache: "no-cache" }));
}
// 접속 통계 (GoatCounter · 쿠키/개인정보 없음)
let lastTracked = "";
function gc(fn, tries = 0) { if (store("edu.admin")) return; if (window.goatcounter && window.goatcounter.count) fn(window.goatcounter); else if (tries < 20) setTimeout(() => gc(fn, tries + 1), 500); }
function trackView(route) {
  const path = "/" + route.replace(/^kid\/(?!new).*/, "kid/edit").replace(/^kid\/new\/.*/, "kid/new");
  if (path === lastTracked) return; lastTracked = path;
  trackUnique();
  gc(g => g.count({ path, title: document.title }));
}
// 실제 사람 수: 휴대폰마다 하루 한 번, 한 달 한 번만 신호 (이 휴대폰에 날짜만 기억, 개인정보 없음)
function trackUnique() {
  const d = todayYmd(), m = d.slice(0, 7);
  let first = store("edu.first"); if (!first) { first = IS_NEW_PHONE ? d : "before"; store("edu.first", first); }   // 처음 온 날만 기억

}
// 앱 연 횟수: 30분 넘게 쉬었다가 다시 보면 한 번 더 (하루 n번째 열기를 따로 세서 합침)
function trackOpen() {
  const now = Date.now(), d = todayYmd(), last = +store("edu.lastOpen") || 0;

function trackEvent(name) { gc(g => g.count({ path: name, title: name, event: true })); }

function moveCode() {

  let bin = ""; new TextEncoder().encode(JSON.stringify(o)).forEach(b => { bin += String.fromCharCode(b); });

// 목록 안의 id·code 는 화면 링크에 쓰이므로 글자·숫자만 허용 (이상한 값은 그 항목만 버림)
function moveSafeList(v) {

    const a = JSON.parse(v); if (!Array.isArray(a)) return null;
    const ok = x => !x || typeof x !== "object" || Object.entries(x).every(([k, y]) => ((k !== "id" && k !== "code") || /^[\w-]{0,60}$/.test(String(y))) && (typeof y !== "object" || ok(y)));

}
function moveApply(code) {

    code = (String(code || "").replace(/^[\s\S]*#move=/, "").match(/[\w-]{16,}/g) || []).sort((a, b) => b.length - a.length)[0] || "";  // 붙여 넣은 글에서 코드만
    const bin = atob(code.replace(/-/g, "+").replace(/_/g, "/"));
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (!o || typeof o !== "object") return false;
    let kidsOk = false;
    for (let [k, v] of Object.entries(o)) {
      if (!(MOVE_KEYS.includes(k) || /^edu\.want\.[\w-]+$/.test(k)) || typeof v !== "string" || v.length > 30000) continue;
      if (k === "edu.kids" || k === "edu.myEv") { v = moveSafeList(v); if (v === null) continue; if (k === "edu.kids") kidsOk = JSON.parse(v).length > 0; }

}

function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dday(s) { return Math.round((parseDate(s) - today()) / 86400000); }
function ddayText(n) { return n === 0 ? "오늘" : n > 0 ? `D-${n}` : `D+${-n}`; }
function md(s) { const d = parseDate(s); return `${d.getMonth() + 1}.${d.getDate()}`; }
function mdw(s) { const d = parseDate(s); return `${d.getMonth() + 1}.${d.getDate()} (${WD[d.getDay()]})`; }

// 같은 이름의 연속 일정(예: ○○ 주간)을 하나로 묶기
function group(events) {
  const out = [];
  [...events].sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name)).forEach(e => {
    const prev = out.find(g => g.name === e.name && (parseDate(e.date) - parseDate(g.end)) / 86400000 <= 3);
    if (prev) prev.end = e.date; else out.push({ ...e, end: e.date });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function upcoming(list) { return list.filter(g => dday(g.end) >= 0); }

function saveMyEvents(l) { store(KEY_MYEV, JSON.stringify(l)); }
function ymdOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function myOccurrences(e) {   // 반복 일정은 다가오는 날짜로 펼침
  const t = today(), out = [], len = e.end ? Math.round((parseDate(e.end) - parseDate(e.start)) / 864e5) : 0;
  const add = d => { const end = new Date(d); end.setDate(end.getDate() + len); out.push({ date: ymdOf(d), end: ymdOf(end) }); };
  if (e.rep === "w") { const d = parseDate(e.start); while (d < t) d.setDate(d.getDate() + 7); for (let i = 0; i < 8; i++) { add(new Date(d)); d.setDate(d.getDate() + 7); } }
  else if (e.rep === "y") { const d = parseDate(e.start); while (d < t && ymdOf(d) !== ymdOf(t)) d.setFullYear(d.getFullYear() + 1); add(d); }
  else add(parseDate(e.start));
  return out;
}
function kidEvents(filter) {
  const rows = [];
  kids().filter(k => filter === "all" || k.id === filter).forEach(k => {
    const s = kidSchool(k); if (!s) return;
    upcoming(group(s.events || [])).forEach(g => rows.push({ ...g, kid: k, school: s.name }));
  });
  upcoming(group((DATA.public_holidays || []).map(p => ({ ...p, holiday: true, pub: true })))).forEach(g => rows.push(g));
  const ks = kids();
  myEvents().forEach(e => {
    if (filter !== "all" && e.kid !== "all" && e.kid !== filter) return;
    const k = e.kid === "all" ? null : ks.find(x => x.id === e.kid); if (e.kid !== "all" && !k) return;

}

function evRow(g, sub, tag) {

  const d = parseDate(g.date);
  const pill = g.holiday ? `<span class="pill pill-coral">${g.pub ? "공휴일" : "휴업"}</span>`
    : `<span class="pill ${n <= 7 ? "pill-indigo" : "pill-gray"}">${ddayText(n)}</span>`;
  return `<div class="ev">
    <div class="datebox ${g.holiday ? "hol" : ""}"><b>${d.getDate()}</b><span>${d.getMonth() + 1}월 ${WD[d.getDay()]}</span></div>
    <div class="ev-body"><div class="ev-name">${esc(g.name)}</div><div class="ev-sub">${tag || ""}${esc(sub || range)}</div></div>
    ${pill}
  </div>`;
}

function regionHighlights() {

  let hero, mine = "";

function adOpen(kind) { trackEvent("광고-" + AD.id + "-" + kind); }
function homeAd() {
  if (!AD) return "";
  return `<section class="section"><div class="sec-head"><h2>아이와 함께 가기 좋은 곳</h2><span style="font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px">광고</span></div>
    <div class="lift" style="padding:0;overflow:hidden">
    <div style="position:relative;cursor:pointer" onclick="adOpen('info');go('ad')"><img src="${AD.img}" alt="${esc(AD.name)} 전경" style="display:block;width:100%;aspect-ratio:2.2/1;object-fit:cover"></div>
    <div style="padding:14px 16px 14px">
      <div style="cursor:pointer" onclick="adOpen('info');go('ad')"><div style="font-weight:800;font-size:15.5px">${esc(AD.name)} <span style="color:var(--muted);font-weight:700">›</span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">${esc(AD.where)} · ${esc(AD.line)}</div>${AD.near ? `<div style="display:inline-block;margin-top:7px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px;background:#FFF1E6;color:#B5541C">🎢 ${AD.near.split("→").map(x => `<span style="white-space:nowrap">${esc(x.trim())}</span>`).join(" → ")}</div>` : ""}</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 12px">${AD.tags.map(t => `<span class="pill pill-gray" style="font-size:11px">${esc(t)}</span>`).join("")}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px">
        <a class="btn btn-soft" style="height:38px;font-size:12.5px;text-decoration:none;padding:0 4px" href="${AD.url}" target="_blank" rel="noopener sponsored" onclick="adOpen('book')">네이버 예약</a>
        <a class="btn btn-soft" style="height:38px;font-size:12.5px;text-decoration:none;padding:0 4px" href="tel:${AD.tel}" onclick="adOpen('tel')">전화 문의</a>
        <button class="btn btn-soft" style="height:38px;font-size:12.5px;padding:0 4px" onclick="adOpen('info');go('ad')">가게 정보</button></div>
    </div></div></section>`;
}
function viewAdInfo() {
  if (!AD) { go("home"); return; }
  const row = (k, v) => `<div class="row" style="align-items:flex-start;gap:12px"><span style="flex:0 0 auto">${k}</span><span class="val" style="text-align:right;line-height:1.5">${v}</span></div>`;
  const li = arr => `<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.75">${arr.map(x => `<li style="margin:3px 0">${esc(x)}</li>`).join("")}</ul>`;
  $view.innerHTML = `<button class="back glass" onclick="history.back()" aria-label="뒤로">${icon.back}</button>
    <div class="lift" style="padding:0;overflow:hidden;margin-top:14px"><div style="position:relative"><img src="${AD.img}" alt="${esc(AD.name)} 전경" style="display:block;width:100%;aspect-ratio:2.2/1;object-fit:cover">
      <span style="position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(20,24,40,.55);border-radius:6px;padding:2px 7px">광고</span></div>
      <div style="padding:16px"><h1 style="font-size:22px;font-weight:800;margin:0">${esc(AD.name)}</h1>
      <p style="font-size:13px;color:var(--muted);margin:5px 0 0">${esc(AD.where)} · ${esc(AD.line)}</p>${AD.near ? `<div style="display:inline-block;margin-top:7px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px;background:#FFF1E6;color:#B5541C">🎢 ${AD.near.split("→").map(x => `<span style="white-space:nowrap">${esc(x.trim())}</span>`).join(" → ")}</div>` : ""}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">
        <a class="btn btn-soft" style="height:42px;font-size:13.5px;text-decoration:none" href="${AD.url}" target="_blank" rel="noopener sponsored" onclick="adOpen('book')">네이버 예약</a>
        <a class="btn btn-soft" style="height:42px;font-size:13.5px;text-decoration:none" href="tel:${AD.tel}" onclick="adOpen('tel')">전화 문의</a></div></div></div>
    <section class="section"><div class="sec-head"><h2>아이와 가면 좋은 점</h2></div><div class="lift card-pad">${li(AD.good)}</div></section>
    ${AD.stay ? `<section class="section"><div class="sec-head"><h2>🏡 펜션도 함께 운영해요</h2></div><div class="lift card-pad">${li(AD.stay.good)}
      <a class="btn btn-3d" style="width:100%;height:44px;margin-top:12px;font-size:14px;text-decoration:none" href="${AD.stay.url}" target="_blank" rel="noopener sponsored" onclick="adOpen('stay')">${esc(AD.stay.name)} 객실 예약 ›</a>
      <a class="btn btn-soft" style="width:100%;height:44px;margin-top:8px;font-size:14px;text-decoration:none" href="tel:${AD.tel}" onclick="adOpen('tel')">📞 예약 전 주인장에게 문의</a>
      <p style="font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.5">날짜·인원·객실이 궁금하면 예약 전에 편하게 전화로 물어보세요.</p></div></section>` : ""}
    <section class="section"><div class="sec-head"><h2>단체 · 워크숍</h2></div><div class="lift card-pad">${li(AD.group)}</div></section>
    <section class="section"><div class="sec-head"><h2>가게 정보</h2></div><div class="lift card-pad">
      ${row("주소", esc(AD.addr))}${row("운영", esc(AD.open))}${row("전화", `<a href="tel:${AD.tel}" onclick="adOpen('tel')" style="color:var(--indigo);font-weight:700;text-decoration:none">${AD.tel}</a>`)}
      ${row("길찾기", `<a href="https://map.naver.com/p/search/${encodeURIComponent(AD.name)}" target="_blank" rel="noopener" onclick="adOpen('map')" style="color:var(--indigo);font-weight:700;text-decoration:none">네이버 지도 ›</a>`)}
      ${row("홈페이지", `<a href="${AD.site}" target="_blank" rel="noopener sponsored" onclick="adOpen('site')" style="color:var(--indigo);font-weight:700;text-decoration:none">lagrills.co.kr ›</a>`)}</div></section>
    <section class="section"><div class="sec-head"><h2>이용 안내</h2></div><div class="lift card-pad">${li(AD.notes)}</div></section>
    <div class="foot">광고 · 가게에서 안내한 정보를 옮겼어요. 가시기 전에 가게에 한 번 더 확인해 주세요.</div>`;
}

const F3D_BASE = "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/";
const F3D = { "🏷️": ["Label", "label"], "💳": ["Credit card", "credit_card"], "🛍️": ["Shopping bags", "shopping_bags"], "🏪": ["Convenience store", "convenience_store"], "🎪": ["Circus tent", "circus_tent"], "🎓": ["Graduation cap", "graduation_cap"], "💼": ["Briefcase", "briefcase"], "📊": ["Bar chart", "bar_chart"], "🏫": ["School", "school"],
  "📚": ["Books", "books"], "📖": ["Open book", "open_book"], "✏️": ["Pencil", "pencil"], "🧸": ["Teddy bear", "teddy_bear"], "📍": ["Round pushpin", "round_pushpin"],
  "🍚": ["Cooked rice", "cooked_rice"], "☀️": ["Sun", "sun"], "🌤️": ["Sun behind small cloud", "sun_behind_small_cloud"], "☁️": ["Cloud", "cloud"], "🌧️": ["Cloud with rain", "cloud_with_rain"],

  "🏋️": ["Person lifting weights/Default", "", "person_lifting_weights_3d_default.png"], "💃": ["Woman dancing/Default", "", "woman_dancing_3d_default.png"], "♨️": ["Hot springs", "hot_springs"], "🧩": ["Puzzle piece", "puzzle_piece"] };
function e3d(e, px) { const f = F3D[e]; if (!f) return e; return `<img src="${F3D_BASE}${f[0].split("/").map(encodeURIComponent).join("/")}/3D/${f[2] || f[1] + "_3d.png"}" alt="" width="${px}" height="${px}" loading="lazy" decoding="async" style="width:${px}px;height:${px}px" onerror="this.replaceWith(document.createTextNode('${e}'))">`; }

// ---------- 내 일정 추가·수정 화면 ----------
let myForm = null;
const MY_QUICK = ["준비물 챙기기", "병원 예약", "생일", "학원 시험", "체험학습", "학교 상담"];

function saveMyEv() {
  const f = myForm; if (!f) return;

// ---------- 오늘 아침 체크 (날씨·급식·학원·학교·마감) ----------
let WEATHER = null;
const KEY_SEEN_EV = "edu.seenEv";
function evAll() { return EVENTS ? [...(EVENTS.city || []), ...(EVENTS.lib || [])] : []; }
function newEvCount() {
  if (!EVENTS) return 0;
  let seen = null; try { seen = JSON.parse(store(KEY_SEEN_EV) || "null"); } catch (e) {}
  const ids = evAll().map(e => e.id);
  if (!seen) { store(KEY_SEEN_EV, JSON.stringify(ids)); return 0; }   // 처음 쓰는 분은 지금 것을 기준으로
  const set = new Set(seen); return ids.filter(id => !set.has(id)).length;
}
async function loadWeather() { try { const r = await dataFetch("weather.json"); if (!r.ok) return; WEATHER = await r.json(); if (DATA) render(); } catch (e) {} }
function markEvSeen() { if (EVENTS) store(KEY_SEEN_EV, JSON.stringify(evAll().map(e => e.id))); }
function shortTitle(x) { x = x.replace(/^\[[^\]]*\]\s*/, "").replace(/\s*\(.*$/, "").replace(/[「」<>]/g, "").trim(); return x.length > 16 ? x.slice(0, 16) + "…" : x; }
function weatherTip(w) {
  const t = [];
  if (w.pop >= 60) t.push("☔ 비 소식이 있어요. 우산 챙기세요");
  if (w.air && /나쁨/.test((w.air.pm10 || "") + (w.air.pm25 || ""))) t.push("😷 미세먼지가 나빠요. 마스크 챙기세요");
  if (w.lo <= 5) t.push("🧥 아침이 추워요. 두꺼운 겉옷 입혀 보내세요");
  else if (w.hi - w.lo >= 10) t.push("🧥 일교차가 커요. 얇은 겉옷 챙기세요");
  return t[0] || "😊 나들이하기 좋은 날씨예요";
}
function homeToday(ks) {
  const now = new Date(), wd = (now.getDay() + 6) % 7, t = todayYmd();
  const rows = [];
  const row = (ic, label, body, act) => `<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);${act ? "cursor:pointer" : ""}" ${act ? `onclick="${act}"` : ""}>
      <span style="flex:0 0 24px;font-size:17px;line-height:20px;text-align:center">${e3d(ic, 22)}</span>
      <div style="flex:1;min-width:0"><div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:2px">${label}</div><div style="font-size:13.5px;line-height:1.5">${body}</div></div>${act ? `<span style="color:var(--muted);font-size:13px;line-height:20px">›</span>` : ""}</div>`;
  if (WEATHER && WEATHER.now && (!WEATHER.date || WEATHER.date === todayYmd())) {  // 어제 받은 날씨는 안 보여 줌
    const w = WEATHER.now;
    rows.push(row(w.icon || "🌤️", "날씨 · 미세먼지", `<b>${esc(w.sky)}</b> ${w.lo}° / ${w.hi}°${w.pop ? ` · 비 ${w.pop}%` : ""}${WEATHER.air ? ` · 미세먼지 <b>${esc(WEATHER.air.pm10)}</b>` : ""}<div style="color:var(--indigo);font-weight:700;margin-top:2px">${esc(weatherTip({ ...w, air: WEATHER.air }))}</div>`));
  }
  if (ks.length && MEALS) {
    const seen = new Set(), lines = [];
    ks.forEach(k => { const sc = kidSchool(k); if (!sc || seen.has(sc.code)) return; seen.add(sc.code);
      const day = schoolMeals(sc.code).filter(m => m[0] === t); const m = day.find(x => x[1] === "중식") || day[0];
      lines.push(`${ks.length > 1 ? `<b>${esc(k.name)}</b> ` : ""}${m ? esc(m[2].slice(0, 2).map(d => d[0].replace(/\(.*?\)/g, "")).join(", ")) + (m[2].length > 2 ? " 외" : "") : `<span style="color:var(--muted)">오늘은 급식이 없어요</span>`}`);
      const bad = m ? m[2].filter(d => alHit(d[1], k.al).length) : [];
      if (bad.length) lines.push(`<span style="color:#B42318;font-weight:700">⚠️ ${ks.length > 1 ? esc(k.name) + " · " : ""}${[...new Set(bad.flatMap(d => alHit(d[1], k.al)))].sort((a, b) => a - b).map(n => ALLERGY[n]).join("·")} 든 메뉴: ${esc(bad.map(d => d[0].replace(/\(.*?\)/g, "")).join(", "))}</span>`); });
    if (lines.length) rows.push(row("🍚", "오늘 급식", lines.join("<br>"), ks.length === 1 && kidSchool(ks[0]) ? `go('school/${kidSchool(ks[0]).code}')` : ""));
  }
  if (ks.length) {
    const ac = [];
    ks.forEach(k => (k.acas || []).forEach(a => { if ((a.days || []).includes(wd)) ac.push({ k, a }); }));
    ac.sort((x, y) => (x.a.s || "99").localeCompare(y.a.s || "99"));
    const hasTimes = ks.some(k => (k.acas || []).some(a => (a.days || []).length));
    if (ac.length) rows.push(row("✏️", `오늘 학원 (${WD[now.getDay()]}요일)`, ac.slice(0, 4).map(({ k, a }) => `${a.s ? `<b>${esc(a.s)}</b> ` : ""}${ks.length > 1 ? esc(k.name) + " · " : ""}${esc(a.n)}`).join("<br>") + (ac.length > 4 ? `<br><span style="color:var(--muted)">외 ${ac.length - 4}곳</span>` : "")));
    else if (hasTimes) rows.push(row("✏️", "오늘 학원", `<span style="color:var(--muted)">오늘은 학원이 없는 날이에요</span>`));
    const soon = kidEvents("all").filter(g => !g.pub && dday(g.date) <= 1).slice(0, 4);
    if (soon.length) rows.push(row(soon.some(g => !g.mine) ? "🏫" : "✏️", soon.some(g => g.mine) ? "오늘·내일 일정" : "학교 일정", soon.map(g => `<b>${dday(g.date) === 0 ? "오늘" : "내일"}</b> ${ks.length > 1 && g.kid ? esc(g.kid.name) + " · " : ""}${g.mine ? "✏️ " : ""}${esc(g.name)}`).join("<br>"), soon.length === 1 && soon[0].mine ? `go('myev/${soon[0].myId}')` : ""));
  }

    const nw = newEvCount();
    if (due.length || nw) rows.push(row("🎪", "행사 · 프로그램", [due.length ? `<b style="color:#C93D22">오늘 신청 마감 ${due.length}건</b> · ${esc(shortTitle(due[0].title))}${due.length > 1 ? " 외" : ""}` : "", nw ? `새로 올라온 행사 <b>${nw}개</b>` : ""].filter(Boolean).join("<br>"), "go('events')"));
  }

// ---------- 급식 ----------
const ALLERGY = ["", "난류", "우유", "메밀", "땅콩", "대두", "밀", "고등어", "게", "새우", "돼지고기", "복숭아", "토마토", "아황산류", "호두", "닭고기", "쇠고기", "오징어", "조개류", "잣"];
function todayYmd() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function schoolMeals(code) { const t = todayYmd(); return ((MEALS && MEALS.schools && MEALS.schools[code]) || []).filter(m => m[0] >= t); }
function nextLunch(code) { const ms = schoolMeals(code); if (!ms.length) return null; const day = ms[0][0]; const same = ms.filter(m => m[0] === day); return { day, meal: same.find(m => m[1] === "중식") || same[0], all: same }; }
function alNames(a) { return String(a || "").split(/[.,\s]+/).map(Number).filter(n => ALLERGY[n]).map(n => ALLERGY[n]); }
function alHit(a, al) { if (!al || !al.length) return []; return String(a || "").split(/[.,\s]+/).map(Number).filter(n => al.includes(n)); }
function kidsAl(list) { return [...new Set(list.flatMap(k => k.al || []))]; }
function dishTap(ev, n, a) { ev.stopPropagation(); const names = alNames(a); toast(names.length ? `${n} · ${names.join(", ")}` : `${n} · 표시된 알레르기 성분 없음`); }
function dishList(ds, small, al) { return ds.map(([n, a]) => { const hit = alHit(a, al);
  return `<span onclick="dishTap(event,'${jsq(n)}','${jsq(a || "")}')" style="display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:12px;cursor:pointer;background:${hit.length ? "#FFECEC" : "var(--ground, #F4F5FB)"};${hit.length ? "box-shadow:inset 0 0 0 1.5px #F2A3A3;color:#B42318;" : ""}font-size:${small ? 12 : 13}px;font-weight:600">${hit.length ? "⚠️ " : ""}${esc(n)}${a ? `<sup style="font-size:9px;color:${hit.length ? "#B42318" : "var(--muted)"};font-weight:${hit.length ? 800 : 500};margin-left:2px">${esc(a)}</sup>` : ""}</span>`; }).join(""); }
function alLegend(al, kidId) { return `<p style="font-size:11.5px;color:var(--muted);line-height:1.6;margin:8px 0 2px">작은 숫자는 알레르기 성분 번호예요. <b>메뉴를 누르면</b> 성분 이름이 보여요.${al && al.length ? ` <span style="color:#B42318;font-weight:700">⚠️ 표시는 우리 아이 알레르기(${al.map(n => ALLERGY[n]).join("·")})가 든 메뉴예요.</span>` : (kidId ? ` <a href="#kid/${kidId}" onclick="event.stopPropagation()" style="color:var(--indigo);font-weight:700">아이 알레르기 등록하기 ›</a>` : "")}</p>`; }
function dayLabel(ymd) { const t = todayYmd(); if (ymd === t) return "오늘"; const d = new Date(ymd + "T00:00:00"), n = new Date(t + "T00:00:00"); if ((d - n) / 864e5 === 1) return "내일"; return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; }
function homeMeals(ks) {
  if (!MEALS) return "";
  const seen = new Set(), cards = [];
  for (const k of ks) {
    const sc = kidSchool(k); if (!sc || seen.has(sc.code)) continue; seen.add(sc.code);
    const nl = nextLunch(sc.code);
    const who = ks.filter(x => x.code === sc.code).map(kidPill).join("");
    cards.push(`<div style="padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="go('school/${jsq(sc.code)}')">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><div style="min-width:0">${ks.length > 1 ? who : ""}<b style="font-size:14px">${esc(sc.name)}</b></div>
      <span style="font-size:12px;color:var(--muted);white-space:nowrap">${nl ? esc(dayLabel(nl.day)) + (nl.meal[3] ? " · " + esc(nl.meal[3]) + "kcal" : "") : ""} ›</span></div>
      ${nl ? dishList(nl.meal[2], false, kidsAl(ks.filter(x => x.code === sc.code))) : `<div style="font-size:13px;color:var(--muted)">이번 주 등록된 급식이 없어요 (방학이거나 아직 올라오지 않았어요)</div>`}</div>`);
    if (cards.length >= 3) break;
  }
  if (!cards.length) return "";
  const al = kidsAl(ks);
  return `<section class="section"><div class="sec-head"><h2>🍚 우리 아이 급식</h2></div><div class="lift card-pad" style="padding-top:2px;padding-bottom:10px">${cards.join("")}${alLegend(al, !al.length && ks.length === 1 ? ks[0].id : (!al.length && ks.length ? ks[0].id : ""))}</div></section>`;
}
function schoolMealsSection(code) {
  if (!MEALS) return "";
  const ms = schoolMeals(code);
  const days = [...new Set(ms.map(m => m[0]))].slice(0, 5);
  const body = days.length ? days.map(day => { const list = ms.filter(m => m[0] === day);
      return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="font-weight:800;font-size:14px;margin-bottom:8px">${esc(dayLabel(day))}${dayLabel(day).length < 4 ? ` <span style="font-weight:500;color:var(--muted);font-size:12px">${esc(mdw(day))}</span>` : ""}</div>
        ${list.map(m => `${list.length > 1 ? `<div style="font-size:12px;color:var(--muted);margin:2px 0 6px">${esc(m[1])}${m[3] ? " · " + esc(m[3]) + "kcal" : ""}</div>` : (m[3] ? `<div style="font-size:12px;color:var(--muted);margin:-4px 0 6px">${esc(m[3])}kcal</div>` : "")}${dishList(m[2], true, kidsAl(kids().filter(k => kidSchool(k) && kidSchool(k).code === code)))}`).join("")}</div>`; }).join("")

  return `<section class="section"><div class="sec-head"><h2>🍚 이번 주 급식</h2></div><div class="lift card-pad" style="padding-top:2px">${body}
    ${alLegend(kidsAl(kids().filter(k => kidSchool(k) && kidSchool(k).code === code)), "")}<p style="font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px">${ALLERGY.slice(1).map((a, i) => `${i + 1} ${a}`).join(" · ")}<br>급식 · 나이스 급식식단정보${MEALS && MEALS.updated_at ? " · " + esc(MEALS.updated_at.slice(5, 16)) + " 갱신" : ""}</p></div></section>`;
}

  const tileCls = { "덕양구": "t-mint", "일산동구": "t-indigo", "일산서구": "t-coral" };

      <span style="color:#8A91A5">›</span></button>`;
  }).join("");
  $view.innerHTML = `<button class="back glass" onclick="go('home')" aria-label="홈으로">${icon.back}</button>
    <h1 style="font-size:27px;font-weight:800;margin-top:14px">학교 일정</h1>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px;gap:10px">

function minsAgo(ts) { if (!ts) return null; const [d, t] = ts.split(" "); const [y, m, dd] = d.split("-").map(Number); const [hh, mi] = t.split(":").map(Number); return Math.max(0, Math.round((Date.now() - new Date(y, m - 1, dd, hh, mi).getTime()) / 60000)); }
function agoText(n) { return n === null ? "" : n < 1 ? "방금" : n < 60 ? `${n}분 전` : n < 1440 ? `${Math.floor(n / 60)}시간 전` : `${Math.floor(n / 1440)}일 전`; }

// 고양시 공공도서관 목록 (도서관 정보나루 · libs.json). 열람실 좌석은 아직 연결하지 않아 운영 정보만 보여 줘요.
function allLibs() { return (SEATS && SEATS.libraries) || []; }
function libList() { const g = libGu ?? (region().gu || ""); return { g, list: allLibs().filter(l => !g || l.gu === g) }; }
function libKey(l) { return encodeURIComponent(l.name); }
// 휴관일 문구로 오늘 쉬는지 대략 판단 (예: "매주 월요일", "매월 둘째·넷째 화요일", "둘째,넷째 월요일")
function closedToday(l, d = new Date()) {
  const c = l.closed || ""; if (!c) return false;
  const wd = WD[d.getDay()] + "요일", nth = Math.ceil(d.getDate() / 7);
  const ORDN = ["", "첫째", "둘째", "셋째", "넷째", "다섯째"];
  // "매주 월요일, 둘째·넷째 화요일" 처럼 요일 단위로 끊어서 본다
  const parts = c.split(/(?<=요일)/);
  return parts.some(p => {
    if (!p.includes(wd)) return false;
    const ns = ORDN.filter((o, i) => i && p.includes(o));
    return !ns.length || ns.includes(ORDN[nth]);
  });
}
function libHours(h) { return (h || "").replace(/\s*\/\s*/g, " · "); }
function libCard(l) {

    ["week", "stats/total", r(6)], ["month", "stats/total", r(29)], ["hits", "stats/hits", { ...r(6), limit: 50 }],
    ["refs", "stats/toprefs", { ...r(29), limit: 8 }], ["systems", "stats/systems", { ...r(29), limit: 6 }], ["locs", "stats/locations", { ...r(29), limit: 6 }]];

// 관리자 학원 분석: 아이 등록 때 고른 학원(익명 집계) + 학원 상세 조회 (최근 30일)
function adminAcaHtml(A) {
  const rows = A.hits30 || [];
  const find = id => ACAS && ACAS.academies.find(x => x.id === id);
  const pick = {}, view = {};
  rows.forEach(h => {
    if (h.event && (h.path.startsWith("학원등록/") || h.path.startsWith("학원선택/"))) { const id = h.path.slice(5); pick[id] = (pick[id] || 0) + h.count; }

  });
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);

  const added = sum(pick);
  const tile = (label, v) => `<div class="stat" style="padding:12px 4px"><div class="k">${label}</div><div class="v" style="font-size:22px">${v.toLocaleString()}</div></div>`;
  const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
  const acaRow = ([id, c], i) => { const a = find(id);
    return `<div class="row" style="gap:10px"><span style="min-width:0;flex:1"><b style="color:var(--muted);margin-right:6px">${i + 1}</b>${esc(a ? a.n : id)}<span style="display:block;font-size:11px;color:var(--muted);margin-top:2px">${esc(a ? [a.r, acaKind(a) !== a.r ? acaKind(a) : "", a.gu, a.dong].filter(Boolean).join(" · ") : "목록에 없는 학원")}</span></span><span class="val"><b>${c.toLocaleString()}</b></span></div>`; };
  const box = (items, empty) => items.length ? `<div class="lift card-pad">${items.join("")}</div>` : `<div class="lift empty">${empty}</div>`;

    const add = (o, w) => Object.entries(o).forEach(([id, c]) => { const a = find(id); const k = (a && key(a)) || "기타"; g[k] = (g[k] || 0) + c * w; });
    add(pick, 3); add(view, 1); return top(g, 8); };
  const bars = arr => { const mx = Math.max(1, ...arr.map(x => x[1]));
    return arr.length ? `<div class="lift card-pad">${arr.map(([k, v]) => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0"><span style="width:92px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</span><span style="flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden"><span style="display:block;height:100%;width:${Math.round(v / mx * 100)}%;background:var(--indigo)"></span></span><span style="width:34px;text-align:right;font-size:12px;font-weight:700">${v}</span></div>`).join("")}</div>` : `<div class="lift empty">아직 기록이 없어요.</div>`; };
  return `<section class="section"><div class="sec-head"><h2>학원 분석</h2><span style="font-size:12px;color:var(--muted)">최근 30일</span></div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">${tile("학원 목록 방문", listPage)}${tile("학원 상세 조회", sum(view))}${tile("등록된 학원 수", Object.keys(pick).length)}</div>

// 관리자 방문자 그래프: 일별(최근 30일) / 월별(최근 12개월)
let adminChart = "day", adminMonths = null, adminMonthsBusy = false;
function pickAdminChart(k) { adminChart = k; render(); }
function kstMonthStart(back) { const k = new Date(Date.now() + 9 * 3600e3); return new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth() - back, 1) - 9 * 3600e3); }

  const iso = d => d.toISOString().slice(0, 19) + "Z";
  const end = iso(new Date(Math.ceil(Date.now() / 3600e3) * 3600e3));
  try {
    // 1) 12개월치 일별 방문자 → 기록이 있는 달 찾기
    const year = await gcApi("stats/total", { start: iso(kstMonthStart(11)), end });
    const has = new Set((year.stats || []).filter(d => d.daily > 0).map(d => d.day.slice(0, 7)));
    const months = [];

    const saved = store(KEY_DATA);
    if (saved) { DATA = JSON.parse(saved); toast("인터넷 연결이 없어 저장된 정보를 보여드려요"); }
    else { $view.innerHTML = `<div class="loading">정보를 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.</div>`; return; }
  }
  render();
  reportKidAcas();
}
// 이 기능 전에 등록해 둔 아이 학원도 한 번만 집계 (학원 번호만 보내고, 아이·기기 정보는 보내지 않음)
function reportKidAcas() {
  if (store("edu.acaReported")) return;
  const ids = new Set(); kids().forEach(k => (k.acas || []).forEach(a => ids.add(a.id)));
  ids.forEach(id => trackEvent("학원등록/" + id));
  store("edu.acaReported", "1");
}
load();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {}));
  // 새 버전이 설치되면 한 번 자동으로 새로고침
  let swReloaded = false; const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (swReloaded || !hadSW) return; swReloaded = true; location.reload(); });
}
</script>
</body>
</html>
