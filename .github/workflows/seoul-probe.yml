name: seoul-probe (서울 구 열기 전 API 확인 — 한 번 쓰고 지움)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      NEIS_KEY: ${{ secrets.NEIS_KEY }}
      LIB_KEY: ${{ secrets.LIB_KEY }}
      KINDER_KEY: ${{ secrets.KINDER_KEY }}
      WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
      KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p logs; python3 -u seoul_probe.py 2>&1 | tee logs/seoul-probe.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/seoul-probe.txt; git commit -qm "서울 확인 기록" && for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
