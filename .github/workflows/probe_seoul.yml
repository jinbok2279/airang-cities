name: probe-seoul (서울 문화행사 확인 — 한 번 쓰고 지움)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p logs; python3 -u probe_seoul.py 2>&1 | tee logs/probe_seoul.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/probe_seoul.txt; git commit -qm "서울 문화행사 확인 기록" && for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
