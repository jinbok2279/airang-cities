name: probe-seoul (서울 문화행사 확인 — 한 번 쓰고 지움)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
      KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
      CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          for pair in 강북:gangbuk 강남:gangnam 중구:jung 동대문:dongdaemun 은평:eunpyeong; do
            c=${pair%%:*}; d=${pair##*:}; rm -rf output; mkdir -p output; cp data/$d/events.json output/ 2>/dev/null || true
            echo "===== $c"; CITY=$c python -u events.py 2>&1 | grep -E "서울|KOPIS|문화포털|저장|\[행사\]|\[교육\]" | head -24
          done
