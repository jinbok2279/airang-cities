name: weather (도시별 날씨)
on:
  schedule:
    - cron: "40 20 * * *"    # 05:40
    - cron: "50 22 * * *"    # 07:50
    - cron: "20 2 * * *"     # 11:20
    - cron: "20 8 * * *"     # 17:20
    - cron: "20 21,23,1,3,9,11 * * *"   # 예비 (위 시각이 GitHub 에서 밀리거나 빠졌을 때만 — 2시간 안에 돈 적 있으면 건너뜀)
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency: { group: weather, cancel-in-progress: false }
jobs:
  gate:   # GitHub 예약 실행이 자주 밀리거나 빠져서, 예비 시각을 여러 개 걸어 둠 → 이미 돌았으면 건너뜀
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo go=1 >> $GITHUB_OUTPUT; exit 0; fi
          since=$(date -u -d "@$(( $(date +%s) - 120*60 ))" +%FT%TZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/weather.yml/runs?created=>=$since&per_page=30" -q "[.workflow_runs[]|select(.id!=${{ github.run_id }} and (.conclusion==\"success\" or .status==\"in_progress\" or .status==\"queued\"))]|length")
          echo "최근 실행 $n 번"; [ "$n" = 0 ] && echo go=1 >> $GITHUB_OUTPUT || echo go=0 >> $GITHUB_OUTPUT
  weather:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p logs; : > logs/weather.txt
          for pair in 용인:yongin 수원:suwon 성남:seongnam 안양:anyang 고양:goyang 화성:hwaseong 부천:bucheon 평택:pyeongtaek 오산:osan 강남:gangnam 양천:yangcheon 노원:nowon 남양주:namyangju 안산:ansan 시흥:siheung 파주:paju 김포:gimpo 의정부:uijeongbu 광주:gwangju 하남:hanam 서초:seocho 송파:songpa 강동:gangdong 광진:gwangjin 마포:mapo 성동:seongdong 강북:gangbuk 강서:gangseo 관악:gwanak 구로:guro 금천:geumcheon 도봉:dobong 동대문:dongdaemun 동작:dongjak 서대문:seodaemun 성북:seongbuk 영등포:yeongdeungpo 용산:yongsan 은평:eunpyeong 종로:jongno 중구:jung 중랑:jungnang 광명:gwangmyeong 군포:gunpo 양주:yangju 이천:icheon 구리:guri 안성:anseong 포천:pocheon 의왕:uiwang 과천:gwacheon 동두천:dongducheon 여주:yeoju 양평:yangpyeong 가평:gapyeong 연천:yeoncheon 연수:yeonsu 남동:namdong 부평:bupyeong 미추홀:michuhol 계양:gyeyang 천안:cheonan 아산:asan; do
            c=${pair%%:*}; d=${pair##*:}; rm -rf output; mkdir -p output
            CITY=$c python -u weather.py 2>&1 | tee -a logs/weather.txt; [ -f output/weather.json ] && mkdir -p data/$d && cp output/weather.json data/$d/ || echo "::warning::$c 날씨 실패"
          done
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs; git diff --cached --quiet && exit 0
          git commit -m "날씨 업데이트"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs --autostash && git push && break; sleep $((i*5)); done
