name: deploy (앱 화면을 Cloudflare Pages로)
# 앱 화면(apps/<도시>)이 바뀔 때만 올린다. 데이터는 앱이 이 저장소(raw)에서 바로 읽어서 항상 최신.
on:
  push:
    paths: ["apps/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fdf0f693700c270e15a856ec9453fde7
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          npm i -g wrangler@3 >/dev/null 2>&1
          changed=$(git diff --name-only HEAD~1 HEAD -- apps | cut -d/ -f2 | sort -u)
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && changed=$(ls apps)
          for d in $changed; do
            [ -d apps/$d ] || continue
            wrangler pages project create airang-$d --production-branch main >/dev/null 2>&1 || true
            echo "== $d"; wrangler pages deploy apps/$d --project-name airang-$d --branch main --commit-dirty=true 2>&1 | tail -2
          done
