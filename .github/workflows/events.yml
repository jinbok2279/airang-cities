name: events (공연·행사만 다시 모으기)
# 하루 수집(daily)에도 들어 있다. 이건 행사만 바로 다시 돌릴 때 쓴다.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: events-only, cancel-in-progress: false }
jobs:
  ev:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { city: 성남, d: seongnam }
          - { city: 안양, d: anyang }
          - { city: 고양, d: goyang }
          - { city: 화성, d: hwaseong }
          - { city: 부천, d: bucheon }
          - { city: 용인, d: yongin }
          - { city: 수원, d: suwon }
          - { city: 평택, d: pyeongtaek }
          - { city: 오산, d: osan }
          - { city: 강남, d: gangnam }
          - { city: 양천, d: yangcheon }
          - { city: 노원, d: nowon }
          - { city: 남양주, d: namyangju }
          - { city: 안산, d: ansan }
          - { city: 시흥, d: siheung }
          - { city: 파주, d: paju }
          - { city: 김포, d: gimpo }
          - { city: 의정부, d: uijeongbu }
          - { city: 광주, d: gwangju }
          - { city: 하남, d: hanam }
          - { city: 서초, d: seocho }
          - { city: 송파, d: songpa }
          - { city: 강동, d: gangdong }
          - { city: 광진, d: gwangjin }
          - { city: 마포, d: mapo }
          - { city: 성동, d: seongdong }
          - { city: 강북, d: gangbuk }
          - { city: 강서, d: gangseo }
          - { city: 관악, d: gwanak }
          - { city: 구로, d: guro }
          - { city: 금천, d: geumcheon }
          - { city: 도봉, d: dobong }
          - { city: 동대문, d: dongdaemun }
          - { city: 동작, d: dongjak }
          - { city: 서대문, d: seodaemun }
          - { city: 성북, d: seongbuk }
          - { city: 영등포, d: yeongdeungpo }
          - { city: 용산, d: yongsan }
          - { city: 은평, d: eunpyeong }
          - { city: 종로, d: jongno }
          - { city: 중구, d: jung }
          - { city: 중랑, d: jungnang }
          - { city: 광명, d: gwangmyeong }
          - { city: 군포, d: gunpo }
          - { city: 양주, d: yangju }
          - { city: 이천, d: icheon }
          - { city: 구리, d: guri }
          - { city: 안성, d: anseong }
          - { city: 포천, d: pocheon }
          - { city: 의왕, d: uiwang }
          - { city: 과천, d: gwacheon }
          - { city: 동두천, d: dongducheon }
          - { city: 여주, d: yeoju }
          - { city: 양평, d: yangpyeong }
          - { city: 가평, d: gapyeong }
          - { city: 연천, d: yeoncheon }
          - { city: 연수, d: yeonsu }
          - { city: 남동, d: namdong }
          - { city: 부평, d: bupyeong }
          - { city: 미추홀, d: michuhol }
          - { city: 계양, d: gyeyang }
          - { city: 천안, d: cheonan }
          - { city: 아산, d: asan }
    env:
      CITY: ${{ matrix.city }}
      KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
      TOUR_KEY: ${{ secrets.TOUR_KEY || secrets.WEATHER_KEY }}
      CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}   # 서울 열린데이터광장 (서울 구 문화행사·공공예약)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p output && cp data/${{ matrix.d }}/events.json output/ 2>/dev/null || true
          mkdir -p logs; f=$(python3 -c "import city;print(city.SCRIPTS.get('events','events'))"); python -u $f.py 2>&1 | tee logs/events-${{ matrix.d }}.txt | tail -15
          cp output/events.json data/${{ matrix.d }}/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/${{ matrix.d }}/events.json logs/events-${{ matrix.d }}.txt; git diff --cached --quiet && exit 0
          git commit -m "${{ matrix.city }} 행사"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
