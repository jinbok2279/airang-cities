name: hospitals (동네 병원 — 의원·병원·응급실)
on:
  schedule:
    - cron: "50 19 * * 0"   # 매주 월요일 04:50 (한국시간)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: hospitals, cancel-in-progress: false }
jobs:
  hospitals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { city: 성남, d: seongnam }
          - { city: 안양, d: anyang }
          - { city: 고양, d: goyang }
          - { city: 화성, d: hwaseong }
          - { city: 부천, d: bucheon }
          - { city: 용인, d: yongin }
          - { city: 수원, d: suwon }
          - { city: 평택, d: pyeongtaek }
          - { city: 오산, d: osan }
          - { city: 강남, d: gangnam }
          - { city: 양천, d: yangcheon }
          - { city: 노원, d: nowon }
          - { city: 남양주, d: namyangju }
          - { city: 안산, d: ansan }
          - { city: 시흥, d: siheung }
          - { city: 파주, d: paju }
          - { city: 김포, d: gimpo }
          - { city: 의정부, d: uijeongbu }
          - { city: 광주, d: gwangju }
          - { city: 하남, d: hanam }
          - { city: 서초, d: seocho }
          - { city: 송파, d: songpa }
          - { city: 강동, d: gangdong }
          - { city: 광진, d: gwangjin }
          - { city: 마포, d: mapo }
          - { city: 성동, d: seongdong }
          - { city: 강북, d: gangbuk }
          - { city: 강서, d: gangseo }
          - { city: 관악, d: gwanak }
          - { city: 구로, d: guro }
          - { city: 금천, d: geumcheon }
          - { city: 도봉, d: dobong }
          - { city: 동대문, d: dongdaemun }
          - { city: 동작, d: dongjak }
          - { city: 서대문, d: seodaemun }
          - { city: 성북, d: seongbuk }
          - { city: 영등포, d: yeongdeungpo }
          - { city: 용산, d: yongsan }
          - { city: 은평, d: eunpyeong }
          - { city: 종로, d: jongno }
          - { city: 중구, d: jung }
          - { city: 중랑, d: jungnang }
          - { city: 광명, d: gwangmyeong }
          - { city: 군포, d: gunpo }
          - { city: 양주, d: yangju }
          - { city: 이천, d: icheon }
          - { city: 구리, d: guri }
          - { city: 안성, d: anseong }
          - { city: 포천, d: pocheon }
          - { city: 의왕, d: uiwang }
    env:
      CITY: ${{ matrix.city }}
      WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p output logs
          cp data/${{ matrix.d }}/hospitals.json output/ 2>/dev/null || true   # 실패하면 지난번 것을 그대로 쓰게
          cp data/${{ matrix.d }}/benefits.json output/ 2>/dev/null || true
          set -o pipefail
          python -u benefits.py 2>&1 | tee logs/benefits-${{ matrix.d }}.txt || true
          python -u hospitals.py 2>&1 | tee logs/hospitals-${{ matrix.d }}.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/hospitals-${{ matrix.d }}.txt logs/benefits-${{ matrix.d }}.txt
          if [ -f output/benefits.json ]; then mkdir -p data/${{ matrix.d }} && cp output/benefits.json data/${{ matrix.d }}/ && git add data/${{ matrix.d }}/benefits.json; fi
          if [ -f output/hospitals.json ]; then mkdir -p data/${{ matrix.d }} && cp output/hospitals.json data/${{ matrix.d }}/ && git add data/${{ matrix.d }}/hospitals.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "${{ matrix.city }} 동네 병원·혜택"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
