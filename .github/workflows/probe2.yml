name: probe2 (새 도시 14곳 열기 전 확인 — 한 번 쓰고 지움)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      NEIS_KEY: ${{ secrets.NEIS_KEY }}
      LIB_KEY: ${{ secrets.LIB_KEY }}
      WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p logs; python3 -u probe2.py 2>&1 | tee logs/probe2.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/probe2.txt; git commit -qm "새 도시 확인 기록" && for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
