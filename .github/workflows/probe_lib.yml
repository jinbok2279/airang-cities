name: probe-lib (인천 도서관 확인 — 한 번 쓰고 지움)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      LIB_KEY: ${{ secrets.LIB_KEY }}
      WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u probe_lib.py
