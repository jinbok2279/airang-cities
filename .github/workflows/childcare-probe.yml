name: childcare-probe (어린이집 정보공개포털 API 시험)
# 키가 맞는지, 도시별 어린이집 수와 받을 수 있는 칸을 확인한다. 키는 기록에 남기지 않는다.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.CHILDCARE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p logs
          python3 - <<'PY' > logs/childcare-probe.txt 2>&1
          import os, re, urllib.request, urllib.parse, collections
          K = os.environ.get("K", "").strip()
          print("키 길이:", len(K))
          SGG = {"용인 처인구": 41461, "용인 기흥구": 41463, "용인 수지구": 41465, "수원 장안구": 41111, "수원 권선구": 41113, "수원 팔달구": 41115, "수원 영통구": 41117,
                 "성남 수정구": 41131, "성남 중원구": 41133, "성남 분당구": 41135, "안양 만안구": 41171, "안양 동안구": 41173,
                 "고양 덕양구": 41281, "고양 일산동구": 41285, "고양 일산서구": 41287, "화성시": 41590, "부천시": 41190}
          BASES = ["https://api.childcare.go.kr/mediate/rest/cpmsapi030/cpmsapi030/request", "http://api.childcare.go.kr/mediate/rest/cpmsapi030/cpmsapi030/request"]
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "airang/1.0"}), timeout=60) as r:
                  return r.read().decode("utf-8", "replace")
          base = None
          for b in BASES:
              try:
                  t = get(b + "?" + urllib.parse.urlencode({"key": K, "arcode": 41461}))
                  print("주소", b.split("/mediate")[0], "응답 길이", len(t)); print(re.sub(r"\s+", " ", t.replace(K, "***"))[:900]); base = b; break
              except Exception as e:
                  print("주소", b.split("/mediate")[0], "실패:", str(e).replace(K, "***")[:200])
          if base:
              tot = 0
              for n, code in SGG.items():
                  try:
                      t = get(base + "?" + urllib.parse.urlencode({"key": K, "arcode": code}))
                      items = re.findall(r"<item>(.*?)</item>", t, re.S)
                      st = collections.Counter(re.search(r"<crstatusname>([^<]*)", i).group(1) if re.search(r"<crstatusname>([^<]*)", i) else "?" for i in items)
                      ty = collections.Counter(re.search(r"<crtypename>([^<]*)", i).group(1) if re.search(r"<crtypename>([^<]*)", i) else "?" for i in items)
                      tot += len(items); print(f"{n}: {len(items)}곳 · 상태 {dict(st)} · 유형 {dict(ty)}")
                  except Exception as e:
                      print(n, "실패:", str(e).replace(K, "***")[:150])
              print("합계", tot)
              if items:
                  print("칸 이름:", sorted(set(re.findall(r"<(\w+)>", items[0]))))
          PY
          cat logs/childcare-probe.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/childcare-probe.txt; git commit -qm "어린이집 API 시험 기록" && for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
