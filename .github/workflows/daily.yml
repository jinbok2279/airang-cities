name: daily (도시별 하루 수집)
# 매일 새벽 5시 30분(한국시간)에 도시 7곳마다 (용인·수원은 city.py 의 scripts 로 그 도시만의 수집기) 학교·급식·학원·유치원·도서관·행사·일자리·운동교실·할인을 모은다.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3      # 도시 50곳 — 3곳씩. 도서관 정보나루 하루 요청 한도를 넘지 않게 천천히
      matrix:
        include:
          - { city: 성남, d: seongnam }
          - { city: 안양, d: anyang }
          - { city: 고양, d: goyang }
          - { city: 화성, d: hwaseong }
          - { city: 부천, d: bucheon }
          - { city: 용인, d: yongin }
          - { city: 수원, d: suwon }
          - { city: 평택, d: pyeongtaek }
          - { city: 오산, d: osan }
          - { city: 강남, d: gangnam }
          - { city: 양천, d: yangcheon }
          - { city: 노원, d: nowon }
          - { city: 남양주, d: namyangju }
          - { city: 안산, d: ansan }
          - { city: 시흥, d: siheung }
          - { city: 파주, d: paju }
          - { city: 김포, d: gimpo }
          - { city: 의정부, d: uijeongbu }
          - { city: 광주, d: gwangju }
          - { city: 하남, d: hanam }
          - { city: 서초, d: seocho }
          - { city: 송파, d: songpa }
          - { city: 강동, d: gangdong }
          - { city: 광진, d: gwangjin }
          - { city: 마포, d: mapo }
          - { city: 성동, d: seongdong }
          - { city: 강북, d: gangbuk }
          - { city: 강서, d: gangseo }
          - { city: 관악, d: gwanak }
          - { city: 구로, d: guro }
          - { city: 금천, d: geumcheon }
          - { city: 도봉, d: dobong }
          - { city: 동대문, d: dongdaemun }
          - { city: 동작, d: dongjak }
          - { city: 서대문, d: seodaemun }
          - { city: 성북, d: seongbuk }
          - { city: 영등포, d: yeongdeungpo }
          - { city: 용산, d: yongsan }
          - { city: 은평, d: eunpyeong }
          - { city: 종로, d: jongno }
          - { city: 중구, d: jung }
          - { city: 중랑, d: jungnang }
          - { city: 광명, d: gwangmyeong }
          - { city: 군포, d: gunpo }
          - { city: 양주, d: yangju }
          - { city: 이천, d: icheon }
          - { city: 구리, d: guri }
          - { city: 안성, d: anseong }
          - { city: 포천, d: pocheon }
          - { city: 의왕, d: uiwang }
          - { city: 과천, d: gwacheon }
          - { city: 동두천, d: dongducheon }
          - { city: 여주, d: yeoju }
          - { city: 양평, d: yangpyeong }
          - { city: 가평, d: gapyeong }
          - { city: 연천, d: yeoncheon }
          - { city: 연수, d: yeonsu }
          - { city: 남동, d: namdong }
          - { city: 부평, d: bupyeong }
          - { city: 미추홀, d: michuhol }
          - { city: 계양, d: gyeyang }
          - { city: 천안, d: cheonan }
          - { city: 아산, d: asan }
    env:
      CITY: ${{ matrix.city }}
      NEIS_KEY: ${{ secrets.NEIS_KEY }}
      KINDER_KEY: ${{ secrets.KINDER_KEY }}
      CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
      LIB_KEY: ${{ secrets.LIB_KEY }}
      KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
      TOUR_KEY: ${{ secrets.TOUR_KEY || secrets.WEATHER_KEY }}   # 공공데이터포털 키는 계정당 하나 (관광공사 API 활용신청만 하면 됨)
      KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}   # 서울 열린데이터광장 (서울 구 문화행사·공공예약)
      WEATHER_KEY: ${{ secrets.WEATHER_KEY }}   # 공공데이터포털 (도서관 표준데이터)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 수집
        run: |
          mkdir -p output && cp data/${{ matrix.d }}/*.json output/ 2>/dev/null || true   # 실패한 수집기는 이전 파일 유지
          mkdir -p logs; for s in collect academies kinder meals libs books events jobs sports deals; do
            echo "::group::$s"; f=$(python3 -c "import city;print(city.SCRIPTS.get('$s','$s'))"); timeout 1500 python -u $f.py 2>&1 | tee -a logs/daily-${{ matrix.d }}.txt || echo "::warning::${{ matrix.city }} $s 실패 (이전 파일 유지)"; echo "::endgroup::"
          done
          if [ "$(date +%d)" = "01" ] || [ ! -f output/elite.json ]; then python -u elite.py || true; fi   # 매달 1일 + 아직 없는 도시는 바로
      - name: 저장
        run: |
          mkdir -p data/${{ matrix.d }} && cp output/*.json data/${{ matrix.d }}/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/${{ matrix.d }} logs/daily-${{ matrix.d }}.txt 2>/dev/null || git add data/${{ matrix.d }}; git diff --cached --quiet && exit 0
          git commit -m "${{ matrix.city }} 하루 수집"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done
